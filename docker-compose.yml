services:
  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kanshi
      POSTGRES_USER: kanshi
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - kanshi_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U kanshi]
      interval: 5s
      timeout: 3s
      retries: 20

  core:
    image: ghcr.io/kanshi-dev/core:${CORE_VERSION}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: kanshi
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: kanshi
      KANSHI_API_KEY: ${KANSHI_API_KEY}
      KANSHI_DASHBOARD_KEY: ${KANSHI_DASHBOARD_KEY}
      KANSHI_ALLOWED_ORIGINS: ${KANSHI_ALLOWED_ORIGINS}
      KANSHI_ALERT_INTERVAL: "10s"
      KANSHI_WEBHOOK_URLS: http://demo-driver:9000
      KANSHI_WEBHOOK_SECRET: ${KANSHI_WEBHOOK_SECRET}
      KANSHI_TRACE_RETENTION: ${KANSHI_TRACE_RETENTION}
      KANSHI_LOG_RETENTION: ${KANSHI_LOG_RETENTION}
    ports:
      - "8080:8080"
      - "50051:50051"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  collector:
    image: otel/opentelemetry-collector:0.157.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      core:
        condition: service_healthy
    environment:
      KANSHI_API_KEY: ${KANSHI_API_KEY}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  agent-identity:
    image: timescale/timescaledb:latest-pg17
    entrypoint: ["sh", "-c"]
    environment:
      DEMO_AGENT_ID: ${DEMO_AGENT_ID}
    command: ["printf '%s' \"$$DEMO_AGENT_ID\" > /var/lib/kanshi-agent/.kanshi-id"]
    volumes:
      - kanshi_agent:/var/lib/kanshi-agent

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        AGENT_VERSION: ${AGENT_VERSION}
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
      agent-identity:
        condition: service_completed_successfully
    hostname: kanshi-demo
    environment:
      KANSHI_CORE_ADDR: core:50051
      KANSHI_API_KEY: ${KANSHI_API_KEY}
      KANSHI_INTERVAL: 2s
      KANSHI_FLUSH_EVERY: 5s
      KANSHI_PROCESS_METRICS: "true"
      KANSHI_PROCESS_TOP_N: "10"
    volumes:
      - kanshi_agent:/var/lib/kanshi-agent

  checkout:
    image: ghcr.io/kanshi-dev/demo-checkout:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      collector:
        condition: service_started
      payments:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      OTEL_RESOURCE_ATTRIBUTES: kanshi.agent.id=${DEMO_AGENT_ID},host.name=kanshi-demo
      PAYMENTS_URL: http://payments:8082/charge
    ports:
      - "127.0.0.1:8081:8081"

  payments:
    image: ghcr.io/kanshi-dev/demo-payments:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - collector
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      OTEL_RESOURCE_ATTRIBUTES: kanshi.agent.id=${DEMO_AGENT_ID},host.name=kanshi-demo
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect(8082,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15

  dashboard:
    image: ghcr.io/kanshi-dev/dashboard:${DASHBOARD_VERSION}
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "3000:80"

  demo-driver:
    image: ghcr.io/kanshi-dev/demo-driver:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
      checkout:
        condition: service_started
    environment:
      KANSHI_DASHBOARD_KEY: ${KANSHI_DASHBOARD_KEY}
      DEMO_INTERVAL_SECONDS: ${DEMO_INTERVAL_SECONDS:-30}

volumes:
  kanshi_agent:
  kanshi_db:
